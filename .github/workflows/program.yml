name: Update RRFP programme

on:
  push:
    branches: [master]
    paths: ['public/**', 'scripts/**', '.github/workflows/program.yml']
  workflow_dispatch:
    inputs:
      refresh:
        description: Read fresh published data from Airtable
        type: boolean
        default: true
  schedule:
    # 22:17 UTC = 03:17 in Yekaterinburg the following day.
    - cron: '17 22 * * *'

permissions:
  contents: read

concurrency:
  group: rrfp-program-publication
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refresh from Airtable
        if: github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.refresh)
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python scripts/update_program.py
      - name: Validate public files
        run: python scripts/validate_public.py
      - name: Save successful snapshots
        if: github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.refresh)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/program.json public/program.last-good.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh published RRFP programme'
            git push origin HEAD:master
          fi
      - name: Upload public files only
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
